name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          command_timeout: 30m
          script: |
            export PATH="/home/ubuntu/.nvm/versions/node/v20.20.2/bin:$PATH"

            cd /home/ubuntu/WorkSync

            # Pull latest code
            git fetch origin main
            git reset --hard origin/main

            # Backend
            cd backend
            npm install
            pm2 describe worksync-backend > /dev/null 2>&1 && \
            pm2 restart worksync-backend || \
            pm2 start server.js --name worksync-backend
            pm2 save

            # Frontend
            cd ../frontend
            npm install
            npm run build

            # Deploy frontend
            mkdir -p /var/www/html/WorkSync
            rm -rf /var/www/html/WorkSync/*
            cp -r dist/* /var/www/html/WorkSync/

            sudo systemctl restart nginx