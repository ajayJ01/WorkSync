name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ubuntu/WorkSync
            git pull origin main
            
            # Backend restart
            cd backend
            npm install
            pm2 restart worksync-backend
            
            # Frontend rebuild
            cd ../frontend
            npm install
            npm run build
            sudo cp -r dist/* /var/www/html/