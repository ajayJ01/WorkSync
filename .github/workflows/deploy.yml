name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Copy build to EC2
        run: |
          rsync -avz --delete frontend/dist/ ubuntu@${{ secrets.EC2_HOST }}:/var/www/html/

      - name: Deploy Backend
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} "
            cd /home/ubuntu/WorkSync &&
            git fetch origin main &&
            git reset --hard origin/main &&
            cd backend &&
            npm install &&
            pm2 describe worksync-backend > /dev/null 2>&1 && pm2 restart worksync-backend || pm2 start server.js --name worksync-backend &&
            pm2 save"