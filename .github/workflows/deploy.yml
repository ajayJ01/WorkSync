name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          command_timeout: 30m
          script: |
            cd /home/ubuntu/WorkSync
            git fetch origin main
            git reset --hard origin/main
            cd backend
            npm install
            pm2 describe worksync-backend > /dev/null 2>&1 && pm2 restart worksync-backend || pm2 start server.js --name worksync-backend
            pm2 save
            cd ../frontend
            npm install
            npm run build
            cp -r dist/* /var/www/html/